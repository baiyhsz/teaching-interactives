<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教学交互页面</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #17233b; }
    main { max-width: 900px; margin: 0 auto; padding: 64px 24px; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 12px; }
    p { color: #52627a; line-height: 1.7; }
    a.card { display: block; margin-top: 28px; padding: 28px; border: 1px solid #dce4ef; border-radius: 16px; background: white; color: inherit; text-decoration: none; box-shadow: 0 8px 28px #1b35500a; }
    a.card:hover, a.card:focus-visible { border-color: #2563eb; outline: none; }
    .card strong { display: block; color: #1750b5; font-size: 1.3rem; }
    .card span { display: block; margin-top: 8px; color: #52627a; }
  </style>
</head>
<body>
  <main>
    <h1>教学交互页面</h1>
    <p>按课程整理的独立交互演示。选择课程，进入相应的实验页面。</p>
    <a class="card" href="computer-architecture/">
      <strong>计算机体系结构</strong>
      <span>缓存、地址转换与处理器架构交互演示</span>
    </a>
  </main>

</html>
